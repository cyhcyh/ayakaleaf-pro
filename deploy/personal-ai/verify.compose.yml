# Isolated verification services. Run with -p rogerleaf-checks.
services:
  sharelatex:
    image: roger1001/rogerleaf:latest
    ports: !override
      - "127.0.0.1:39080:80"
    environment:
      OVERLEAF_SITE_URL: http://localhost:39080
      OVERLEAF_APP_NAME: Rogerleaf Verification
      OVERLEAF_SESSION_SECRET: personal-ai-isolated-verification-only
      OVERLEAF_INVITE_TOKEN_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  mock:
    image: roger1001/rogerleaf:latest
    restart: "no"
    entrypoint: ["node", "/overleaf/services/web/modules/workbench/test/mock-ai.mjs"]
