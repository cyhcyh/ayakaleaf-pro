name: rogerleaf-local

services:
  sharelatex:
    image: roger1001/rogerleaf:latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:80"
    stop_grace_period: 60s
    volumes:
      - overleaf-data:/var/lib/overleaf
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      OVERLEAF_APP_NAME: Rogerleaf
      OVERLEAF_SITE_URL: http://localhost:8080
      OVERLEAF_SITE_LANGUAGE: zh-CN
      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex?replicaSet=overleaf
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis
      OVERLEAF_SESSION_SECRET: ${OVERLEAF_SESSION_SECRET:?Set OVERLEAF_SESSION_SECRET in .env}
      OVERLEAF_INVITE_TOKEN_SECRET: ${OVERLEAF_INVITE_TOKEN_SECRET:?Set OVERLEAF_INVITE_TOKEN_SECRET in .env}
      ENABLED_LINKED_FILE_TYPES: project_file,project_output_file,url
      ENABLE_CONVERSIONS: "true"
      EMAIL_CONFIRMATION_DISABLED: "true"
      OVERLEAF_ALLOW_PUBLIC_REGISTRATION: "true"
      OVERLEAF_TEMPLATE_GALLERY: "true"
      GIT_BRIDGE_ENABLED: "false"
      ENABLE_PANDOC_CONVERSIONS: "false"
      # Compile projects in the independent TeX Live 2026.1 sandbox.
      SANDBOXED_COMPILES: "true"
      SANDBOXED_COMPILES_SIBLING_CONTAINERS: "true"
      DOCKER_RUNNER: "true"
      TEX_LIVE_DOCKER_IMAGE: ghcr.io/ayaka-notes/texlive-full:2026.1
      COMPILE_TIMEOUT: "180"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1/login"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20m

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "overleaf", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
      - ./bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js:ro
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    extra_hosts:
      - mongo:127.0.0.1
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (!db.hello().isWritablePrimary) { quit(1) }"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  overleaf-data:
  mongo-data:
  redis-data:
